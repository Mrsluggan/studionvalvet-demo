# Admin för StudionValvet (Sveltia CMS). Innehållet sparas i ny/content/ och
# sidan byggs om av .github/workflows/pages.yml efter varje ändring.
backend:
  name: github
  repo: Mrsluggan/studionvalvet-demo
  branch: main
  base_url: https://sluggan-cms-auth.ericflyger.workers.dev
  commit_messages:
    create: 'Admin: lägg till {{collection}} "{{slug}}"'
    update: 'Admin: uppdatera {{collection}} "{{slug}}"'
    delete: 'Admin: ta bort {{collection}} "{{slug}}"'
    uploadMedia: 'Admin: ladda upp "{{path}}"'
    deleteMedia: 'Admin: ta bort "{{path}}"'

site_url: https://valvet.sluggan.com
display_url: https://valvet.sluggan.com/ny/
logo:
  src: /img/logo.png

media_folder: ny/uppladdat
public_folder: /ny/uppladdat
media_libraries:
  default:
    config:
      max_file_size: 52428800
      slugify_filename: true
      transformations:
        raster_image:
          format: webp
          quality: 85
          width: 2400
          height: 2400

slug:
  encoding: ascii
  clean_accents: true

i18n:
  structure: single_file
  locales: [sv, en]
  default_locale: sv

collections:
  - name: jobb
    label: Jobb
    label_singular: Jobb
    description: Jobben på startsidan och under Våra jobb.
    folder: ny/content/jobb
    format: json
    extension: json
    create: true
    delete: true
    i18n: true
    identifier_field: titel
    slug: "{{titel}}"
    summary: "{{titel}} – {{kund}}"
    thumbnail: bild
    sortable_fields: [ordning, titel]
    preview_path: "ny/jobb/{{slug}}/"
    fields:
      - { name: ordning, label: Ordning, widget: number, value_type: int, required: false, hint: "Lägst nummer visas först." }
      - { name: titel, label: Rubrik, widget: string, i18n: true }
      - { name: kund, label: Kund, widget: string, i18n: true }
      - { name: uppdrag, label: Uppdrag, widget: string, i18n: true, hint: "T.ex. Social media, reklamfilm, branding" }
      - { name: bild, label: Huvudbild, widget: image, hint: "Visas i helskärm på startsidan och under Våra jobb. Liggande bild, gärna minst 1600 px bred." }
      - { name: ingress, label: Ingress, widget: text, i18n: true, hint: "En eller två meningar. Visas på startsidan och under Våra jobb." }
      - { name: brief, label: Brief, widget: text, i18n: true, required: false, hint: "Tom rad mellan stycken." }
      - { name: arbete, label: Vårt arbete, widget: text, i18n: true, required: false, hint: "Tom rad mellan stycken." }
      - name: lankar
        label: Länkar
        label_singular: Länk
        widget: list
        required: false
        i18n: duplicate
        hint: Visas efter texten, t.ex. till Spotify eller kundens sida.
        fields:
          - { name: text, label: Text, widget: string, i18n: true }
          - { name: url, label: Adress, widget: string, i18n: duplicate }
      - name: media
        label: Bilder och film
        label_singular: Block
        widget: list
        required: false
        i18n: duplicate
        hint: Visas under texten, uppifrån och ner.
        types:
          - name: rad
            label: Rad med bilder eller filmer
            widget: object
            summary: "{{stil}}"
            fields:
              - name: stil
                label: Utseende
                widget: select
                default: vanlig
                i18n: duplicate
                options:
                  - { label: Vanlig, value: vanlig }
                  - { label: "Stående (9:16), t.ex. reels", value: staende }
                  - { label: "Ruta, för loggor och grafik", value: ruta }
              - name: objekt
                label: Bilder
                label_singular: Bild
                widget: list
                i18n: duplicate
                hint: Alla bilder i samma rad visas bredvid varandra.
                fields:
                  - { name: bild, label: Bild, widget: image, required: false, i18n: duplicate, hint: "För film: stillbilden som visas innan filmen startar." }
                  - { name: video, label: Film (valfri), widget: file, accept: video/mp4, required: false, i18n: duplicate, hint: "MP4, helst under 50 MB. Längre filmer läggs hellre på YouTube eller Vimeo och bäddas in." }
                  - { name: alt, label: Beskrivning för skärmläsare, widget: string, required: false, i18n: true }
                  - { name: bakgrund, label: Bakgrundsfärg (bara för Ruta), widget: string, required: false, i18n: duplicate, hint: "T.ex. #2e422c" }
          - name: inbaddning
            label: Inbäddning (YouTube, Vimeo, Spotify, Instagram)
            widget: object
            summary: "{{url}}"
            fields:
              - { name: url, label: Länk, widget: string, i18n: duplicate, hint: "Klistra in länken som den ser ut i webbläsaren." }
              - { name: bild, label: Bild bredvid (valfri), widget: image, required: false, i18n: duplicate }
              - { name: alt, label: Beskrivning för skärmläsare, widget: string, required: false, i18n: true }
          - name: bildtext
            label: Bildtext
            widget: object
            summary: "{{text}}"
            fields:
              - { name: text, label: Text, widget: string, i18n: true }

  - name: kunder
    label: Kunder
    label_singular: Kund
    description: Loggorna på sidan Kunder.
    folder: ny/content/kunder
    format: json
    extension: json
    create: true
    delete: true
    identifier_field: namn
    slug: "{{namn}}"
    thumbnail: logga
    sortable_fields: [ordning, namn]
    fields:
      - { name: ordning, label: Ordning, widget: number, value_type: int, required: false, hint: "Lägst nummer visas först." }
      - { name: namn, label: Namn, widget: string }
      - { name: logga, label: Logga, widget: image, required: false, hint: "PNG med genomskinlig bakgrund. Visas vit på sidan. Utan logga visas namnet i text." }
      - name: jobb
        label: Länkar till jobb
        widget: relation
        collection: jobb
        value_field: "{{slug}}"
        search_fields: [titel]
        display_fields: [titel]
        required: false

  - name: sidor
    label: Sidor
    description: Startsidan, sidrubriker, Om oss, Kontakt och allmänna texter.
    i18n: true
    files:
      - name: start
        label: Startsidan
        file: ny/content/sidor/start.json
        i18n: true
        fields:
          - { name: rubrik, label: Rubrik över filmen, widget: text, i18n: true, hint: "Ny rad blir radbrytning." }
          - { name: film, label: Film, widget: file, accept: video/mp4, required: false, hint: "Spelas utan ljud i en loop. MP4, kort (10–30 s) och helst under 15 MB, annars laddar sidan långsamt." }
          - { name: film_mobil, label: Film för mobil (valfri), widget: file, accept: video/mp4, required: false, hint: "Mindre version av samma film. Utan den används filmen ovan även på mobil." }
          - { name: stillbild, label: Stillbild, widget: image, required: false, hint: "Visas medan filmen laddar, och i stället för film om ingen film är vald." }
          - { name: seo_titel, label: Sidtitel (Google och flik), widget: string, i18n: true, required: false }
          - { name: seo_beskrivning, label: Beskrivning (Google), widget: text, i18n: true, required: false, hint: "En eller två meningar som visas i sökresultat." }
      - name: vara-jobb
        label: Våra jobb
        file: ny/content/sidor/vara-jobb.json
        i18n: true
        fields:
          - { name: rubrik, label: Rubrik, widget: string, i18n: true, hint: "Används även i menyn." }
          - { name: seo_titel, label: Sidtitel (Google och flik), widget: string, i18n: true, required: false }
          - { name: seo_beskrivning, label: Beskrivning (Google), widget: text, i18n: true, required: false, hint: "En eller två meningar som visas i sökresultat." }
      - name: kunder
        label: Kunder
        file: ny/content/sidor/kunder.json
        i18n: true
        fields:
          - { name: rubrik, label: Rubrik, widget: string, i18n: true, hint: "Används även i menyn." }
          - { name: sista_rutan, label: Text i sista rutan, widget: text, i18n: true, required: false, hint: "Länkar till Kontakt. Lämna tom för att ta bort rutan." }
          - { name: seo_titel, label: Sidtitel (Google och flik), widget: string, i18n: true, required: false }
          - { name: seo_beskrivning, label: Beskrivning (Google), widget: text, i18n: true, required: false, hint: "En eller två meningar som visas i sökresultat." }
      - name: om-oss
        label: Om oss
        file: ny/content/sidor/om-oss.json
        i18n: true
        fields:
          - { name: rubrik, label: Namn i menyn, widget: string, i18n: true }
          - { name: bild, label: Bild överst, widget: image }
          - { name: bild_alt, label: Beskrivning av bilden, widget: string, i18n: true, required: false }
          - { name: ingress, label: Ingress, widget: text, i18n: true }
          - { name: text, label: Text, widget: text, i18n: true, hint: "Tom rad mellan stycken. Två stycken blir två spalter." }
          - { name: tjanster_rubrik, label: Rubrik över tjänsterna, widget: string, i18n: true }
          - name: tjanster
            label: Tjänster
            label_singular: Tjänst
            widget: list
            i18n: duplicate
            fields:
              - { name: namn, label: Namn, widget: string, i18n: true }
              - { name: text, label: Text, widget: text, i18n: true }
              - { name: jobb, label: Länkar till jobb, widget: relation, collection: jobb, value_field: "{{slug}}", search_fields: [titel], display_fields: [titel], required: false, i18n: duplicate }
          - { name: seo_titel, label: Sidtitel (Google och flik), widget: string, i18n: true, required: false }
          - { name: seo_beskrivning, label: Beskrivning (Google), widget: text, i18n: true, required: false, hint: "En eller två meningar som visas i sökresultat." }
      - name: kontakt
        label: Kontakt
        file: ny/content/sidor/kontakt.json
        i18n: true
        fields:
          - { name: rubrik, label: Rubrik, widget: string, i18n: true, hint: "Används även i menyn och sidfoten." }
          - { name: adress, label: Adress, widget: text, i18n: true, hint: "Används även i sidfoten." }
          - { name: kartadress, label: Adress för kartan, widget: string, hint: "Det som söks på i Google Maps, t.ex. Kungsängsgatan 17, 753 32 Uppsala." }
          - { name: epost, label: E-post, widget: string }
          - { name: boka_text, label: Text före e-postadressen, widget: string, i18n: true }
          - { name: mejlamne, label: Ämnesrad när man klickar på e-posten, widget: string, i18n: true, required: false }
          - name: personer
            label: Personer
            label_singular: Person
            widget: list
            fields:
              - { name: namn, label: Namn, widget: string }
              - { name: telefon, label: Telefon, widget: string, hint: "Skriv som 070-123 45 67. På engelska visas det som +46 70 123 45 67." }
          - { name: seo_titel, label: Sidtitel (Google och flik), widget: string, i18n: true, required: false }
          - { name: seo_beskrivning, label: Beskrivning (Google), widget: text, i18n: true, required: false, hint: "En eller två meningar som visas i sökresultat." }
      - name: allmant
        label: Allmänt
        file: ny/content/sidor/allmant.json
        i18n: true
        fields:
          - { name: foretagsnamn, label: Företagsnamn, widget: string, hint: "Visas i sidfoten." }
          - { name: logga, label: Logga, widget: image, hint: "Visas uppe till höger, på startsidan och som ikon i webbläsarfliken. Kvadratisk PNG." }
          - name: sociala
            label: Sociala medier
            label_singular: Länk
            widget: list
            fields:
              - { name: namn, label: Namn, widget: string }
              - { name: url, label: Adress, widget: string }
          - { name: kund_etikett, label: "Ordet före kundnamnet (Kund:)", widget: string, i18n: true }
          - { name: uppdrag_etikett, label: "Ordet före uppdraget (Uppdrag:)", widget: string, i18n: true }
          - { name: se_jobbet, label: Länktext på startsidan, widget: string, i18n: true }
          - { name: nasta_jobb, label: Text över nästa jobb, widget: string, i18n: true }
          - { name: brief_rubrik, label: Rubrik Brief, widget: string, i18n: true }
          - { name: arbete_rubrik, label: Rubrik Vårt arbete, widget: string, i18n: true }
